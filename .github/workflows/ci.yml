name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run tests
        run: npm test
      - name: Check shell and validator syntax
        run: |
          bash -n scripts/install-template.sh
          node --check scripts/validate-source-package.mjs
      - name: Check text-file whitespace
        shell: bash
        run: |
          find . -type f \
            \( -name '*.css' -o -name '*.json' -o -name '*.md' -o -name '*.mjs' -o -name '*.sh' -o -name '*.ts' -o -name '*.tsx' -o -name '*.yml' -o -name '*.yaml' \) \
            -not -path './.git/*' -print0 |
            xargs -0 awk 'index($0, "\r") { print FILENAME ":" FNR ": CR"; bad = 1 } END { exit bad }'
